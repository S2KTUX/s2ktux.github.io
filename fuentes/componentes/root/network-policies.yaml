apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-network-policies
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-network-policies
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-network-policies
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-network-policies
subjects:
  - kind: ServiceAccount
    name: kube-network-policies
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-network-policies
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: kube-network-policies
  template:
    metadata:
      labels:
        app: kube-network-policies
    spec:
      hostNetwork: true
      serviceAccountName: kube-network-policies
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: netpol
          # Imagen local ya probada; el ejecutable es una compilación propia
          # del código upstream v1.1.2, no una imagen oficial linux/386.
          image: busybox:1.37.0-musl
          imagePullPolicy: Never
          command: ["/bin/netpol"]
          args:
            - "--hostname-override=$(MY_NODE_NAME)"
            - "--nfqueue-id=98"
            - "--v=2"
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 50m
              memory: 40Mi
          volumeMounts:
            - name: binary
              mountPath: /bin/netpol
              readOnly: true
            - name: nri
              mountPath: /var/run/nri
            - name: netns
              mountPath: /var/run/netns
              mountPropagation: HostToContainer
      volumes:
        - name: binary
          hostPath:
            path: /mnt/kube-client/bin/netpol
            type: File
        - name: nri
          hostPath:
            path: /var/run/nri
            type: DirectoryOrCreate
        - name: netns
          hostPath:
            path: /var/run/netns
            type: Directory
