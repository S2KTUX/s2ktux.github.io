apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: 10.77.0.20
  bindPort: 6443
nodeRegistration:
  name: controlplane
  criSocket: unix:///run/containerd/containerd.sock
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
kubernetesVersion: v1.35.9
clusterName: s2ktux-privado
# Opción soportada por kubeadm: menos trabajo de CPU al crear los certificados.
encryptionAlgorithm: ECDSA-P256
controlPlaneEndpoint: 127.0.0.1:6443
networking:
  podSubnet: 192.168.0.0/16
  serviceSubnet: 10.96.0.0/12
apiServer:
  certSANs:
    - localhost
    - 127.0.0.1
