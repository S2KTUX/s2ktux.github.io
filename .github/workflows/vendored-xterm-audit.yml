name: Avisos del xterm vendorizado

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Consultar versión estable y OSV
        run: npm run audit:xterm
